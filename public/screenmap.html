  <title>Beseder CRM — Screen Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0c12;
      --surface: #111520;
      --border: rgba(255,255,255,0.06);
      --border-bright: rgba(255,255,255,0.12);
      --teal: #0d9488;
      --teal-light: #14b8a6;
      --orange: #f97316;
      --orange-light: #fb923c;
      --emerald: #10b981;
      --emerald-light: #34d399;
      --arrow: #4b5563;
      --arrow-label: #6b7280;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #475569;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      font-family: 'Heebo', sans-serif;
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: auto;
    }
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,12,18,0.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 14px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-brand { display: flex; align-items: center; gap: 12px; }
    .header-logo {
      width: 30px; height: 30px;
      background: linear-gradient(135deg, #0d9488, #10b981);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-style: normal;
    }
    .header-title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
    .header-subtitle { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .legend { display: flex; align-items: center; gap: 18px; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-secondary); }
    .legend-dot { width: 9px; height: 9px; border-radius: 3px; }
    .canvas-wrap { padding: 40px 36px 80px; overflow-x: auto; }
    .svg-wrap {
      display: block;
      min-width: 1520px;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .svg-wrap { animation: fadeInUp 0.7s ease 0.1s both; }
    /* dot grid */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none; z-index: 0;
    }
    .canvas-wrap { position: relative; z-index: 1; }
  </style>
</head>
